name: Dispatch Telegram Alerts

on:
  schedule:
    # Runs every 15 minutes (free on GitHub Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  dispatch-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hackline Telegram Dispatch Endpoint
        run: |
          TARGET_URL="${{ secrets.NEXT_PUBLIC_APP_URL || secrets.APP_URL || 'https://hackline.vercel.app' }}"
          echo "Dispatching alerts to: ${TARGET_URL}/api/notifications/telegram/dispatch"
          curl -s -X POST "${TARGET_URL}/api/notifications/telegram/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-internal-dispatch: true" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 30
